<!DOCTYPE html>
<html>
<head>
    <title>AI Lost & Found Dashboard</title>

    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0f1117, #1a1d2b);
            color: white;
        }

        header {
            padding: 20px;
            font-size: 22px;
            font-weight: bold;
            background: rgba(20,22,35,0.6);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .container {
            padding: 20px;
        }

        .analytics {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }

        .card-stat {
            flex: 1;
            background: rgba(255,255,255,0.05);
            padding: 15px;
            border-radius: 12px;
        }

        .search-bar {
            margin-bottom: 20px;
        }

        input {
            padding: 10px;
            width: 250px;
            border-radius: 8px;
            border: none;
        }

        .upload-box {
            margin-bottom: 20px;
        }

        button {
            padding: 8px 12px;
            background: #2a2f45;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
            gap: 20px;
        }

        .card {
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            overflow: hidden;
            transition: 0.3s;
            border: 1px solid rgba(255,255,255,0.08);
        }

        .card:hover {
            transform: translateY(-5px);
        }

        video {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 12px;
            background: black;
        }

        .info {
            padding: 12px;
        }

        .badge {
            background: red;
            padding: 4px 8px;
            border-radius: 5px;
            font-size: 12px;
            display: inline-block;
            margin-top: 6px;
        }
    </style>

    <script>
        function filterVideos() {
            let input = document.getElementById("search").value.toLowerCase();
            let cards = document.getElementsByClassName("card");

            for (let i = 0; i < cards.length; i++) {
                let text = cards[i].innerText.toLowerCase();
                cards[i].style.display = text.includes(input) ? "" : "none";
            }
        }

        setInterval(() => location.reload(), 10000);
    </script>

</head>

<body>

<header>
    AI Lost & Found Dashboard
</header>

<div class="container">

    <!-- ANALYTICS -->
    <div class="analytics">
        <div class="card-stat">Total Events: {{ total }}</div>

        {% for cam, count in cam_stats.items() %}
        <div class="card-stat">{{ cam }}: {{ count }}</div>
        {% endfor %}
    </div>

    <!-- SEARCH -->
    <div class="search-bar">
        <input type="text" id="search" onkeyup="filterVideos()" placeholder="Search...">
    </div>

    <!-- UPLOAD -->
    <div class="upload-box">
        <form action="/upload" method="post" enctype="multipart/form-data">
            <input type="file" name="file" required>
            <button type="submit">Upload Video</button>
        </form>
    </div>

    <!-- EVENTS -->
    <div class="grid">

        {% for v in videos %}
        <div class="card">

            <video controls preload="none" poster="/thumb/{{ v.thumb }}">
                <source src="/video/{{ v.filename }}" type="video/mp4">
            </video>

            <div class="info">
                <div>Event #{{ v.id }}</div>
                <div>{{ v.camera }} | {{ v.time }}</div>
                <div class="badge">UNATTENDED</div>
            </div>

        </div>
        {% endfor %}

    </div>

</div>

</body>
</html>
